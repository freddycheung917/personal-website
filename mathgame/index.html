<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Month Grade 3 to 6 Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night-city page (Toronto after work) with light "paper" cards for every decision. The bank balance is always visible, it is the score. */
:root{
  --night:#121A3A;
  --night2:#1C2650;
  --card:#F7F8FC;
  --ink:#161C3A;
  --muted:#4A5578;
  --line:#D9DEEE;
  --amber:#FFB02E;
  --blue:#2F5FE0;
  --gain:#0E6B35;
  --gainbg:#DFF3E6;
  --loss:#A8231B;
  --lossbg:#FCE6E4;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Figtree',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;background:var(--night);color:#fff;font:500 17px/1.55 var(--body)}
button,input{font-family:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;font-family:var(--display)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.card :focus-visible,.card:focus-visible{outline-color:var(--blue)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;z-index:9}
.skip:focus{left:8px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 56px}
.num{font-variant-numeric:tabular-nums lining-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--display);letter-spacing:.01em}
.gtag{font:700 14px var(--body);padding:4px 10px;border-radius:12px;background:var(--amber);color:var(--night)}
.bal{display:inline-flex;align-items:baseline;gap:8px;min-height:44px;padding:6px 16px;border:1.5px solid #3A4678;border-radius:22px;background:var(--night2)}
.bal small{font-size:14px;color:#C9D1F0;font-weight:700}
.bal b{font:700 22px/1 var(--display);color:var(--amber)}
.quit{min-height:44px;padding:0 16px;border-radius:22px;background:transparent;border:1.5px solid #3A4678;cursor:pointer;font-weight:700;font-size:15px}
.quit:hover{border-color:#fff}

.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--night2);padding:44px 28px 150px}
.hero h1{font:700 clamp(44px,9vw,76px)/1 var(--display);letter-spacing:-.02em}
.hero .kick{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
.lede{max-width:46ch;margin-top:16px;color:#D6DCF5;font-size:19px}
.sky{position:absolute;left:0;bottom:0;width:100%;height:140px}
.gradepick{position:relative;margin-top:24px}
.gradepick p{font-size:14px;font-weight:700;color:#C9D1F0;margin-bottom:8px}
.grades{display:flex;flex-wrap:wrap;gap:10px}
.gbtn{min-height:48px;padding:0 22px;border-radius:24px;border:2px solid #3A4678;background:transparent;cursor:pointer;font:700 18px var(--body)}
.gbtn:hover{border-color:#fff}
.gbtn[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--night)}
.namefield{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;position:relative}
.resume{margin-top:20px;padding:16px 18px;border-radius:16px;background:#1D2757;border:2px solid var(--amber);position:relative;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.resume p{margin:0;font-size:17px;line-height:1.4;color:#fff}
.resume small{display:block;font-size:14px;color:#C9D1F0;margin-top:2px}
.codes{margin-top:20px;position:relative;border-top:1px solid #3A4678;padding-top:12px}
.codes summary{cursor:pointer;font-weight:700;font-size:16px;color:#C9D1F0;min-height:44px;display:flex;align-items:center}
.codes h3{margin:14px 0 6px;font-size:16px;color:#fff}
.codes p.sm{margin:0 0 8px;font-size:14px;color:#C9D1F0;line-height:1.45}
.codes textarea{width:100%;min-height:78px;padding:12px;border-radius:12px;border:2px solid #3A4678;background:var(--night);color:#fff;font:600 14px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical;word-break:break-all}
.codes .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.codes .btn.ghost{border-color:#C9D1F0;color:#fff}
.codes .msg{margin-top:8px;font-size:15px;font-weight:700;color:var(--amber)}
.namefield label{display:block;font-size:14px;font-weight:700;color:#C9D1F0;margin-bottom:6px}
.namefield input{height:52px;width:230px;padding:0 16px;border-radius:14px;border:2px solid #3A4678;background:var(--night);font:700 19px var(--body);color:#fff}
.skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;position:relative}
.skills span{padding:4px 12px;border-radius:14px;background:#2A3670;font-size:14px;font-weight:700;color:#E3E8FB}

.card{background:var(--card);color:var(--ink);border-radius:24px;padding:28px}
.kick{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chead{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.cicon{flex:none;width:64px;height:64px;border-radius:18px;background:var(--night);display:flex;align-items:center;justify-content:center}
.card h1{font:700 clamp(28px,5vw,38px)/1.1 var(--display);letter-spacing:-.01em}
.card h2.prompt{font:600 clamp(22px,3.4vw,28px)/1.25 var(--display);margin:6px 0 16px}
.story{font-size:18px;color:var(--muted);margin:10px 0 4px;max-width:60ch}
.intro{font-size:19px;max-width:56ch;margin-bottom:22px}
.visual{margin:6px 0 20px}
.prog{display:flex;gap:6px;flex:1;min-width:120px;max-width:300px}
.seg{flex:1;height:10px;border-radius:5px;background:#3A4678}
.seg.ok{background:var(--amber)}
.seg.miss{background:transparent;border:2px solid #FF8F85}
.seg.cur{background:#fff}

.btn{min-height:54px;padding:0 30px;border-radius:27px;border:2px solid transparent;cursor:pointer;font:700 19px var(--body);display:inline-flex;align-items:center;justify-content:center}
.btn.go{background:var(--amber);color:var(--night)}
.btn.dark{background:var(--night);color:#fff}
.btn.ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn.small{min-height:46px;font-size:16px;padding:0 20px}
.btn:disabled{background:var(--line);color:var(--ink);cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-height:88px;padding:10px 16px;border-radius:18px;background:#fff;border:2.5px solid var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;font:700 20px/1.3 var(--body);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.sel{background:#E8EEFF;border-color:var(--blue)}
.opt.right{background:var(--gainbg);border-color:var(--gain)}
.opt.wrong{background:var(--lossbg);border-color:var(--loss)}
.tag{font:700 14px var(--body)}
.opt.right .tag{color:var(--gain)}
.opt.wrong .tag{color:var(--loss)}
.numrow label{display:block;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field{display:inline-flex;align-items:center;gap:10px;font:600 28px var(--display)}
.field input{width:190px;font:600 28px var(--display);padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
.field input.ok{border-color:var(--gain);background:var(--gainbg)}
.field input.bad{border-color:var(--loss);background:var(--lossbg)}
.note{margin-top:16px;padding:14px 18px;border-radius:14px;font-size:17px;line-height:1.45;color:var(--ink)}
.note.hint{background:#FFF1CC}
.note.good{background:var(--gainbg)}
.note.good strong{color:var(--gain)}
.note.bad{background:var(--lossbg)}
.note.bad strong{color:var(--loss)}

.eq{display:inline-block;font:600 32px var(--display);padding:10px 20px;border-radius:14px;background:#EEF1FA}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chipd{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:8px 12px;border-radius:14px;background:#EEF1FA}
.chipd small{font-size:13px;font-weight:700;color:var(--muted)}
.chipd b{font:600 26px var(--display)}
.seq{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-width:56px;height:56px;padding:0 12px;border-radius:14px;background:#EEF1FA;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font:600 26px var(--display)}
.chip.q{background:var(--amber);border-color:var(--ink)}
.rect{max-width:100%;height:auto}
.rect text{font:600 18px var(--display);fill:var(--ink)}
.tags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tagc{padding:12px 16px;border-radius:14px;background:#EEF1FA}
.tagc small{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tagc b{font:600 22px var(--display)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .12em;font-weight:700}
.frac .n{padding:0 .2em .12em;border-bottom:.09em solid currentColor}
.frac .d{padding-top:.12em}
.fbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:44px;max-width:480px}
.fbar i{border:3px solid var(--ink);background:#fff;border-radius:6px}
.fbar i.on{background:var(--amber)}
.chart{margin:0;max-width:580px;padding-right:18px}
.chart figcaption{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:10px}
.crow{display:grid;grid-template-columns:116px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.clab{font-size:15px;font-weight:700}
.ctrack{height:28px;border-right:2px solid var(--line)}
.ctrack b{display:block;height:100%;background:var(--blue);border-radius:0 6px 6px 0}
.cticks{position:relative;height:22px}
.cticks span{position:absolute;top:0;transform:translateX(-50%);font-size:14px;font-weight:700;color:var(--muted)}

.stmtbox{overflow-x:auto;margin-top:6px}
.stmt{width:100%;border-collapse:collapse;font-size:16px}
.stmt th{text-align:left;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--ink)}
.stmt td{padding:9px 10px;border-bottom:1px solid var(--line)}
.stmt .r{text-align:right;white-space:nowrap}
.stmt .g{color:var(--gain);font-weight:700}
.stmt .l{color:var(--loss);font-weight:700}
.stmt tfoot td{font-weight:700;border-bottom:none;border-top:2px solid var(--ink)}
.big{font:700 clamp(52px,12vw,84px)/1 var(--display);letter-spacing:-.02em}
.delta{font-weight:700;font-size:18px}
.result{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
@media (max-width:640px){
  .opts{grid-template-columns:1fr}
  .card{padding:20px}
  .hero{padding:32px 20px 140px}
  .tags{grid-template-columns:1fr}
  .crow{grid-template-columns:92px 1fr}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<main id="main" class="wrap"><div id="view"></div></main>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  var ri = function (a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; };
  var pick = function (a) { return a[ri(0, a.length - 1)]; };
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) { var j = ri(0, i); var t = r[i]; r[i] = r[j]; r[j] = t; }
    return r;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
  function r2(x) { return Math.round(x * 100) / 100; }
  function usd(n, sign) {
    var neg = n < 0, a = Math.abs(n), whole = Math.abs(a - Math.round(a)) < 1e-9;
    var s = '$' + (whole ? Math.round(a).toLocaleString('en-CA') : a.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    return (neg ? '−' : (sign ? '+' : '')) + s;
  }
  function usd2(n) { return '$' + Math.abs(n).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fr(n, d) { return '<span class="frac"><span class="n">' + n + '</span><span class="d">' + d + '</span></span>'; }
  function fopt(n, d) { return { html: fr(n, d), key: n + '/' + d }; }
  function T(h, m) {
    var mm = ((m % 60) + 60) % 60, hh = h + Math.floor(m / 60);
    hh = (((hh - 1) % 12) + 12) % 12 + 1;
    return hh + ':' + (mm < 10 ? '0' : '') + mm;
  }
  function icon(name) {
    var p = {
      building: '<rect x="14" y="10" width="26" height="40" rx="2"/><path d="M20 18h4M30 18h4M20 26h4M30 26h4M20 34h4M30 34h4M25 50v-8h6v8"/>',
      kettle: '<path d="M16 24h24l-3 24H19z"/><path d="M40 28h6a4 4 0 0 1 0 12h-7M22 24c0-6 4-8 6-8s6 2 6 8"/>',
      cheque: '<rect x="10" y="16" width="44" height="32" rx="3"/><path d="M16 26h18M16 34h12M40 38h8"/><circle cx="44" cy="26" r="3"/>',
      bus: '<rect x="12" y="12" width="40" height="34" rx="5"/><path d="M12 28h40M12 20h40"/><circle cx="22" cy="46" r="4"/><circle cx="42" cy="46" r="4"/>',
      stall: '<path d="M10 24l4-10h36l4 10c0 4-3 6-6 6s-6-2-6-6c0 4-3 6-6 6s-6-2-6-6c0 4-3 6-6 6s-6-2-6-6c0 4-3 6-6 6s-6-2-6-6z"/><path d="M14 30v20h36V30M26 50V38h12v12"/>'
    }[name];
    return '<svg width="40" height="40" viewBox="0 0 64 64" fill="none" stroke="#FFB02E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
  }

  /* ---------- question builders and visuals ---------- */
  function mcOptions(correct, cands, count) {
    var seen = {}; seen[correct.key] = true;
    var out = [correct];
    shuffle(cands).forEach(function (c) {
      if (out.length >= count || seen[c.key]) return;
      seen[c.key] = true; out.push(c);
    });
    return shuffle(out).map(function (o) { return { html: o.html, val: o.key, correct: o.key === correct.key }; });
  }
  function MC(o, correct, cands, count) {
    o.kind = 'mc'; o.visual = o.visual || '';
    o.options = mcOptions(correct, cands, count); o.correctKey = correct.key; o.ansText = correct.html;
    return o;
  }
  function NUM(o) { o.kind = 'num'; o.visual = o.visual || ''; o.prefix = o.prefix || ''; o.suffix = o.suffix || ''; return o; }
  function wrapq(g, extra) { return function () { var q = g(); for (var k in extra) q[k] = extra[k]; return q; }; }
  function rectVis(w, h, unit) {
    var u = 20, W = w * u, H = h * u, x = 56, y = 34;
    return '<svg class="rect" width="' + (x + W + 30) + '" height="' + (y + H + 16) + '" viewBox="0 0 ' + (x + W + 30) + ' ' + (y + H + 16) + '" role="img" aria-label="Rectangle ' + w + ' ' + unit + ' by ' + h + ' ' + unit + '">' +
      '<rect x="' + x + '" y="' + y + '" width="' + W + '" height="' + H + '" rx="6" fill="#E8EEFF" stroke="#2F5FE0" stroke-width="4"/>' +
      '<text x="' + (x + W / 2) + '" y="22" text-anchor="middle">' + w + ' ' + unit + '</text>' +
      '<text x="' + (x - 10) + '" y="' + (y + H / 2 + 6) + '" text-anchor="end">' + h + ' ' + unit + '</text></svg>';
  }
  function gridVis(w, h) {
    var s = '<div role="img" aria-label="A grid of ' + w + ' rows of ' + h + ' squares" style="display:grid;grid-template-columns:repeat(' + w + ',30px);gap:3px">';
    for (var i = 0; i < w * h; i++) s += '<i style="width:30px;height:30px;background:#E8EEFF;border:2px solid #2F5FE0;border-radius:4px"></i>';
    return s + '</div>';
  }
  function barVis(total, filled) {
    var s = '<div class="fbar" role="img" aria-label="' + filled + ' of ' + total + ' equal parts shaded">';
    for (var i = 0; i < total; i++) s += '<i' + (i < filled ? ' class="on"' : '') + '></i>';
    return s + '</div>';
  }
  function seqVis(terms, hidden) {
    var label = terms.map(function (t, i) { return hidden.indexOf(i) > -1 ? 'blank' : t; }).join(', ');
    return '<div class="seq" role="img" aria-label="Number pattern: ' + label + '">' + terms.map(function (t, i) {
      var q = hidden.indexOf(i) > -1;
      return '<span class="chip num' + (q ? ' q' : '') + '">' + (q ? '?' : t) + '</span>';
    }).join('') + '</div>';
  }
  function eqVis(txt, label) { return '<span class="eq num" role="img" aria-label="' + label + '">' + txt + '</span>'; }
  function chartVis(ds, max, step, caption) {
    var gl = (step / max * 100);
    var rows = ds.map(function (r) {
      return '<div class="crow"><span class="clab">' + r.n + '</span><div class="ctrack" style="background:repeating-linear-gradient(90deg,#D9DEEE 0 2px,transparent 2px ' + gl + '%)"><b style="width:' + (r.v / max * 100) + '%"></b></div></div>';
    }).join('');
    var ticks = '';
    for (var t = 0; t <= max; t += step) ticks += '<span style="left:' + (t / max * 100) + '%">' + t + '</span>';
    return '<figure class="chart" role="img" aria-label="Bar chart. ' + caption + '. ' + ds.map(function (r) { return r.n + ' ' + r.v; }).join(', ') + '">' +
      '<figcaption>' + caption + '</figcaption>' + rows + '<div class="crow"><span class="clab"></span><div class="cticks num">' + ticks + '</div></div></figure>';
  }
  function dataSet(names, vals, mult) {
    var n = shuffle(names).slice(0, 4), v = shuffle(vals).slice(0, 4);
    return n.map(function (x, i) { return { n: x, v: v[i] * mult }; });
  }
  function twoOf(ds) { return shuffle(ds).slice(0, 2).sort(function (a, b) { return b.v - a.v; }); }

  /* ======================================================================
     GRADE 6
     ====================================================================== */
  function g6RentRatio() {
    var R = pick([1500, 1800, 2400, 3000]), r = pick([[2, 1], [3, 1], [3, 2], [4, 1]]), big = r[0], small = r[1], p = big + small, mine = R * small / p;
    return NUM({ label: 'Rent split', stake: 60, answer: mine, prefix: '$', ansText: usd(mine),
      story: 'You found a two-bedroom. Your roommate wants the bigger room, so you agree to split the rent unevenly.',
      prompt: 'Rent is ' + usd(R) + ' a month, split ' + big + ' : ' + small + ' (roommate : you). How much do you pay each month?',
      hint: 'Add the parts of the ratio to get the total number of parts. Divide the rent by that number.',
      explain: 'There are ' + p + ' parts in all. ' + usd(R) + ' ÷ ' + p + ' = ' + usd(R / p) + ' a part. You pay ' + small + ' part' + (small > 1 ? 's' : '') + ': ' + usd(mine) + '.',
      win: 'The split is fair and written down. No awkward conversations later.',
      lose: 'You send the wrong amount and have to fix it with your roommate.' });
  }
  function g6UnitRent() {
    var s1, r1, s2, r2_, u1, u2;
    do { s1 = ri(10, 18) * 50; r1 = ri(28, 44) * 50; s2 = ri(10, 18) * 50; r2_ = ri(28, 44) * 50; u1 = r1 / s1; u2 = r2_ / s2; }
    while (Math.abs(u1 - u2) < 0.15 || s1 === s2);
    var a = u1 < u2, best = a ? 'A' : 'B';
    var vis = '<div class="tags"><div class="tagc"><small>Apartment A</small><b>' + s1 + ' sq ft · ' + usd(r1) + '</b></div><div class="tagc"><small>Apartment B</small><b>' + s2 + ' sq ft · ' + usd(r2_) + '</b></div></div>';
    return MC({ label: 'Apartment comparison', stake: 50, visual: vis,
      story: 'Two apartments are on your shortlist. Both are close to work. The bigger one is not always the better deal.',
      prompt: 'Which apartment costs less per square foot?',
      hint: 'Divide each rent by its size to get a rate: dollars per square foot.',
      explain: 'A: ' + usd(r1) + ' ÷ ' + s1 + ' ≈ $' + u1.toFixed(2) + ' per sq ft. B: ' + usd(r2_) + ' ÷ ' + s2 + ' ≈ $' + u2.toFixed(2) + ' per sq ft. Apartment ' + best + ' is cheaper per sq ft.',
      win: 'You sign for the better value and keep more of every square foot you pay for.',
      lose: 'You pick the pricier one per square foot and pay extra all year.' },
      { html: 'Apartment ' + best, key: best }, [{ html: 'Apartment ' + (a ? 'B' : 'A'), key: a ? 'B' : 'A' }], 2);
  }
  function g6Flooring() {
    var w = ri(10, 16), h = ri(8, 14), p = pick([2, 3, 4]), c = w * h * p;

      '<div class="row"><button class="btn ghost small" data-a="getcode">Get my save code</button></div>' +
      (codeUI.text ? '<label for="mycode" class="sm" style="display:block;margin-top:10px;font-size:14px;color:#C9D1F0">Your save code</label><textarea id="mycode" readonly>' + esc(codeUI.text) + '</textarea><div class="row"><button class="btn ghost small" data-a="copycode">Copy code</button></div>' : '') +
      '<h3>Have a code?</h3><label for="loadcode" class="sm" style="display:block;font-size:14px;color:#C9D1F0">Paste it here</label><textarea id="loadcode" placeholder="FM1-..."></textarea>' +
      '<div class="row"><button class="btn ghost small" data-a="loadcode">Load code</button></div>' +
      '<p class="msg" role="status" aria-live="polite">' + esc(codeUI.msg) + '</p></details>';
    view.innerHTML =
      '<section class="hero">' + SKY +
      '<p class="kick">Maths game for Grades 3 to 6</p><h1 id="title" tabindex="-1">First Month</h1>' +
      '<p class="lede">New city. New job. A bank account with ' + usd(START[g]) + ' in it. Every price, pay stub and bill is a maths problem. Smart choices save money. Slips cost you.</p>' +
      '<div class="gradepick"><p id="gp">Choose your grade</p><div class="grades" role="group" aria-labelledby="gp">' +
      [3, 4, 5, 6].map(function (n) { return '<button class="gbtn" data-a="grade" data-k="' + n + '" aria-pressed="' + (n === g) + '">Grade ' + n + '</button>'; }).join('') + '</div></div>' +
      '<div class="namefield"><div><label for="name">Your name</label><input id="name" type="text" maxlength="20" autocomplete="off" placeholder="Alex" value="' + esc(store.name) + '"></div>' +
      '<button class="btn go" data-a="begin">Start your month</button></div>' +
      resume +
      '<div class="skills">' + SKILLS[g].map(function (s) { return '<span>' + s + '</span>'; }).join('') + '</div>' +
      (best ? '<p class="lede" style="font-size:16px;position:relative">Best month in Grade ' + g + ': <strong class="num">' + usd(best) + '</strong></p>' : '') +
      (r ? '<p class="lede" style="font-size:14px;position:relative;margin-top:6px">Starting a new month replaces your saved month.</p>' : '') +
      codes + '</section>';
    focusEl('title');
  }
  function renderIntro() {
    S = { screen: 'intro' };
    var c = G.CH[G.ch];
    view.innerHTML = topbar(true) +
      '<section class="card"><div class="chead"><div class="cicon">' + icon(c.icon) + '</div><div><p class="kick">' + c.kick + ' · Chapter ' + (G.ch + 1) + ' of ' + G.CH.length + '</p>' +
      '<h1 id="title" tabindex="-1">' + c.title + '</h1></div></div>' +
      '<p class="intro">' + (G.ch === 0 ? esc(G.name) + ', ' : '') + c.intro + '</p>' +
      '<button class="btn dark" data-a="startch">Start chapter</button></section>';
    focusEl('title');
  }
  function newQuestion() {
    S = { screen: 'play', attempt: 0, sel: null, val: '', done: false, ok: false, hint: false, wrongNow: false, elim: [], msg: '', delta: 0, focusId: 'title' };
  }
  function renderPlay() {
    var c = G.CH[G.ch], q = G.qs[G.ch][G.qi];
    var segs = G.qs[G.ch].map(function (_, i) {
      var st = i < G.qi ? (G.ledger.filter(function (l) { return l.ch === G.ch && l.q === i; })[0].amt < 0 ? 'miss' : 'ok') : i === G.qi ? 'cur' : 'todo';
      return '<span class="seg ' + st + '"></span>';
    }).join('');
    var answers;
    if (q.kind === 'mc') {
      answers = '<div class="opts" role="group" aria-label="Answer choices">' + q.options.map(function (o, i) {
        var cls = 'opt', tag = '', chosen = S.sel === o.val, wp = S.elim.indexOf(o.val) > -1;
        if (S.done && o.correct) { cls += ' right'; tag = 'Smart choice'; }
        else if (wp) { cls += ' wrong'; tag = 'Not quite'; }
        else if (chosen) cls += ' sel';
        return '<button id="opt-' + i + '" class="' + cls + '" data-a="pick" data-k="' + esc(o.val) + '" aria-pressed="' + chosen + '"' + (S.done || wp ? ' disabled' : '') + '>' +
          '<span>' + o.html + '</span>' + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    } else {
      var fc = S.done ? (S.ok ? 'ok' : 'bad') : '';
      answers = '<div class="numrow"><label for="ans">Your answer</label><div class="field">' + (q.prefix ? '<span>' + q.prefix + '</span>' : '') +
        '<input id="ans" class="' + fc + '" type="text" inputmode="decimal" autocomplete="off" value="' + esc(S.val) + '"' + (S.done ? ' disabled' : '') + '>' +
        (q.suffix ? '<span style="font-size:20px">' + q.suffix + '</span>' : '') + '</div></div>';
    }
    var last = G.qi === G.qs[G.ch].length - 1, actions;
    if (S.done) actions = '<button id="next" class="btn dark" data-a="next">' + (last ? 'See chapter summary' : 'Next scene') + '</button>';
    else actions = '<button id="check" class="btn go" data-a="check"' + (q.kind === 'mc' && S.sel == null ? ' disabled' : '') + '>' + (q.kind === 'mc' && S.sel == null ? 'Pick an answer first' : 'Check') + '</button>' +
      '<button id="hintbtn" class="btn ghost small" data-a="hint" aria-expanded="' + S.hint + '">' + (S.hint ? 'Hide hint' : 'Show hint') + '</button>';
    var fb = '';
    if (S.hint && !S.done) fb += '<div class="note hint"><strong>Hint.</strong> ' + q.hint + '</div>';
    if (S.wrongNow && !S.done) fb += '<div class="note bad"><strong>Not quite.</strong> You can try once more before it costs you.</div>';
    if (S.msg) fb += '<div class="note bad">' + S.msg + '</div>';
    if (S.done && S.ok) fb += '<div class="note good"><strong>' + usd(S.delta, true) + (S.attempt === 1 ? '' : ' (half, second try)') + '.</strong> ' + q.win + ' ' + q.explain + '</div>';
    if (S.done && !S.ok) fb += '<div class="note bad"><strong>' + usd(S.delta, true) + '.</strong> ' + q.lose + ' The answer is ' + q.ansText + '. ' + q.explain + '</div>';
    view.innerHTML = topbar(true) +
      '<div style="display:flex;align-items:center;gap:14px;margin:-6px 0 14px"><div class="prog" role="img" aria-label="Scene ' + (G.qi + 1) + ' of ' + G.qs[G.ch].length + '">' + segs + '</div><span style="font-size:15px;font-weight:700;color:#C9D1F0">' + c.title + '</span></div>' +
      '<section class="card" aria-labelledby="title"><p class="kick">Scene ' + (G.qi + 1) + ' · stakes ' + usd(q.stake) + '</p>' +
      '<p class="story">' + q.story + '</p>' +
      '<h2 class="prompt" id="title" tabindex="-1">' + q.prompt + '</h2>' +
      (q.visual ? '<div class="visual">' + q.visual + '</div>' : '') +
      answers + '<div class="actions">' + actions + '</div><div aria-live="polite">' + fb + '</div></section>';
    focusEl(S.focusId);
  }
  function renderChapterEnd() {
    S = { screen: 'chend' };
    var c = G.CH[G.ch], rows = G.ledger.filter(function (l) { return l.ch === G.ch; });
    var sub = rows.reduce(function (a, l) { return a + l.amt; }, 0);
    var last = G.ch === G.CH.length - 1;
    view.innerHTML = topbar(true) +
      '<section class="card"><p class="kick">' + c.kick + ' · chapter ' + (G.ch + 1) + ' done</p><h1 id="title" tabindex="-1">' + c.title + ': ' + (sub >= 0 ? 'you came out ahead' : 'a rough patch') + '</h1>' +
      '<div class="stmtbox" style="margin-top:14px"><table class="stmt num"><thead><tr><th scope="col">Decision</th><th scope="col" class="r">Result</th></tr></thead><tbody>' +
      rows.map(function (l) { return '<tr><td>' + l.label + '</td><td class="r ' + (l.amt < 0 ? 'l' : 'g') + '">' + usd(l.amt, true) + '</td></tr>'; }).join('') +
      '</tbody><tfoot><tr><td>Chapter total</td><td class="r ' + (sub < 0 ? 'l' : 'g') + '">' + usd(sub, true) + '</td></tr></tfoot></table></div>' +
      '<div class="actions"><button class="btn dark" data-a="nextch">' + (last ? 'See your month' : 'Next: ' + G.CH[G.ch + 1].title) + '</button></div></section>';
    focusEl('title');
  }
  function renderEnding() {
    S = { screen: 'end' };
    var tot = G.ledger.reduce(function (a, l) { return a + l.stake; }, 0), net = G.balance - G.start, ratio = (net + tot) / (2 * tot);
    var t = ratio >= 0.85 ? ['Financially fearless', 'You read every price tag, checked every deal and kept your cool. Future you says thanks.']
      : ratio >= 0.65 ? ['Solid start', 'A few slips, but your money habits are heading the right way.']
      : ['Tight month, good lessons', 'Some of the numbers caught you out. Play again and see how much more you can save.'];
    var newBest = G.balance > (store.best[G.grade] || 0);
    if (newBest) store.best[G.grade] = G.balance;
    store.run = null; save();
    var run = G.start;
    var rows = G.ledger.map(function (l) { run += l.amt; return '<tr><td>' + l.label + '</td><td class="r ' + (l.amt < 0 ? 'l' : 'g') + '">' + usd(l.amt, true) + '</td><td class="r">' + usd(run) + '</td></tr>'; }).join('');
    view.innerHTML = '<header class="top"><div class="logo">First Month <span class="gtag">Grade ' + G.grade + '</span></div></header>' +
      '<section class="card"><div class="result"><p class="kick">' + esc(G.name) + '’s month, end of statement</p>' +
      '<p class="big num" id="title" tabindex="-1">' + usd(G.balance) + '</p>' +
      '<p class="delta" style="color:' + (net >= 0 ? 'var(--gain)' : 'var(--loss)') + '">' + usd(net, true) + ' since you started with ' + usd(G.start) + (newBest ? ' · new best month' : '') + '</p>' +
      '<h1 style="margin-top:10px">' + t[0] + '</h1><p class="intro" style="margin:0">' + t[1] + '</p></div>' +
      '<p class="kick">Your bank statement</p><div class="stmtbox"><table class="stmt num"><thead><tr><th scope="col">Decision</th><th scope="col" class="r">Amount</th><th scope="col" class="r">Balance</th></tr></thead><tbody>' +
      '<tr><td>Opening balance</td><td class="r"></td><td class="r">' + usd(G.start) + '</td></tr>' + rows + '</tbody></table></div>' +
      '<div class="actions"><button class="btn go" data-a="again">Play again</button><button class="btn ghost" data-a="title">Change grade or name</button></div></section>';
    focusEl('title');
  }

  /* ---------- actions ---------- */
  function parseNum(raw) { var s = raw.replace(/[^0-9.\-]/g, ''); if (!s || s === '.' || s === '-') return NaN; return Number(s); }
  function settle(amt) {
    var q = G.qs[G.ch][G.qi];
    G.balance += amt; S.delta = amt;
    G.ledger.push({ ch: G.ch, q: G.qi, label: q.label, amt: amt, stake: q.stake });
    saveRun();
  }
  function check() {
    var q = G.qs[G.ch][G.qi], ok;
    S.msg = '';
    if (q.kind === 'mc') { if (S.sel == null) return; ok = S.sel === q.correctKey; }
    else {
      var raw = (S.val || '').trim();
      if (!raw) { S.msg = 'Type your answer first.'; S.focusId = 'ans'; renderPlay(); return; }
      var v = parseNum(raw);
      if (isNaN(v)) { S.msg = 'Use numbers only, for example 120 or 36.50.'; S.focusId = 'ans'; renderPlay(); return; }
      ok = Math.abs(v - q.answer) < 0.005;
    }
    S.attempt++;
    if (ok) { S.done = true; S.ok = true; S.wrongNow = false; settle(S.attempt === 1 ? q.stake : q.stake / 2); S.focusId = 'next'; }
    else {
      if (q.kind === 'mc') { S.elim.push(S.sel); S.sel = null; }
      if (S.attempt >= 2) { S.done = true; S.ok = false; S.wrongNow = false; settle(-q.stake); S.focusId = 'next'; }
      else { S.wrongNow = true; S.hint = true; S.focusId = q.kind === 'mc' ? 'hintbtn' : 'ans'; }
    }
    renderPlay();
  }
  function keepName() { var n = document.getElementById('name'); if (n) store.name = n.value.trim().slice(0, 20); }
  function act(a, d) {
    if (a === 'grade') {
      var nm0 = document.getElementById('name'); if (nm0) store.name = nm0.value.trim().slice(0, 20);
      pickedGrade = +d.k; renderTitle(); focusEl(null); return;
    }
    if (a === 'begin') {
      var nm = (document.getElementById('name').value || '').trim().slice(0, 20);
      store.name = nm; store.grade = pickedGrade; save(); newGame(nm, pickedGrade); renderIntro();
    }
    else if (a === 'resume') { if (store.run) resumeRun(store.run); }
    else if (a === 'getcode') { codeUI.open = true; codeUI.text = makeCode(); codeUI.msg = ''; keepName(); renderTitle(); focusEl('mycode'); return; }
    else if (a === 'copycode') {
      var ta = document.getElementById('mycode'), done = function (ok) { codeUI.open = true; codeUI.msg = ok ? 'Copied. Paste it somewhere safe.' : 'Select the code and copy it by hand.'; keepName(); renderTitle(); focusEl('mycode'); };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(codeUI.text).then(function () { done(true); }, function () { done(false); }); else { ta.select(); done(document.execCommand('copy')); } }
      catch (e) { done(false); }
      return;
    }
    else if (a === 'loadcode') {
      var t = document.getElementById('loadcode'), d = readCode(t ? t.value : '');
      codeUI.open = true;
      if (!d) { codeUI.msg = 'That code does not look right. Check that you copied all of it.'; keepName(); renderTitle(); focusEl('loadcode'); return; }
      [3, 4, 5, 6].forEach(function (g) { if (d.best[g] && d.best[g] > (store.best[g] || 0)) store.best[g] = d.best[g]; });
      if (d.name) store.name = d.name;
      store.run = d.run; if (d.run) { store.grade = d.run.g; pickedGrade = d.run.g; }
      save(); codeUI.text = ''; codeUI.msg = d.run ? 'Code loaded. Press Continue to carry on.' : 'Code loaded. Your best scores are back.';
      renderTitle(); return;
    }
    else if (a === 'title') { pickedGrade = G ? G.grade : pickedGrade; renderTitle(); }
    else if (a === 'again') { newGame(store.name, G.grade); renderIntro(); }
    else if (a === 'startch') { G.qi = 0; newQuestion(); renderPlay(); }
    else if (a === 'pick') {
      if (S.done) return;
      S.sel = d.k; S.msg = ''; S.focusId = null; renderPlay();
      var idx = G.qs[G.ch][G.qi].options.findIndex(function (o) { return o.val === d.k; });
      focusEl('opt-' + idx);
    }
    else if (a === 'check') check();
    else if (a === 'hint') { S.hint = !S.hint; S.focusId = 'hintbtn'; renderPlay(); }
    else if (a === 'next') {
      if (G.qi + 1 >= G.qs[G.ch].length) renderChapterEnd();
      else { G.qi++; newQuestion(); renderPlay(); }
    }
    else if (a === 'nextch') {
      if (G.ch + 1 >= G.CH.length) renderEnding();
      else { G.ch++; G.qi = 0; renderIntro(); }
    }
    window.scrollTo(0, 0);
  }

  view.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]');
    if (!t || t.disabled) return;
    act(t.getAttribute('data-a'), { k: t.getAttribute('data-k') });
  });
  view.addEventListener('input', function (e) { if (e.target.id === 'ans') { S.val = e.target.value; S.msg = ''; } });
  view.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'ans' && S.screen === 'play' && !S.done) { e.preventDefault(); S.val = e.target.value; check(); }
    if (e.target.id === 'name') { e.preventDefault(); act('begin', {}); }
  });

  function start(data) {
    if (data && data.best && typeof data.best === 'object') store = { best: data.best, name: String(data.name || ''), grade: +data.grade || 6, run: cleanRun(data.run) };
    else load();
    pickedGrade = [3, 4, 5, 6].indexOf(store.grade) > -1 ? store.grade : 6;
    renderTitle();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return store; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
  window.__T = { GENS: GENS, chaptersFor: chaptersFor, newGame: newGame, getG: function () { return G; }, makeCode: makeCode, readCode: readCode, resumeRun: resumeRun, getStore: function () { return store; }, setStore: function (x) { store = x; } };
})();
</script>
</body>
</html>
