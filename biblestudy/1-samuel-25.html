    // --- APP STATE ---
    let currentStageIndex = 0;
    let isLeaderMode = true;
    let isHighlightActive = true;
    let timerDuration = stages[0].suggestedTime * 60;
    let timerRemaining = timerDuration;
    let timerInterval = null;
    let isTimerRunning = false;
    let selectedRole = "david";

    // --- DOM REFERENCES ---

    const stageContainer = document.getElementById("stageContainer");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const stepIndicator = document.getElementById("stepIndicator");
    const timerDisplay = document.getElementById("timerDisplay");
    const timerIcon = document.getElementById("timerIcon");
    const leaderBanner = document.getElementById("leaderBanner");
    const modeToggleBtn = document.getElementById("modeToggleBtn");
    const modeText = document.getElementById("modeText");
    const hlToggleBtn = document.getElementById("hlToggleBtn");

    // --- INITIALIZATION ---
    window.addEventListener("DOMContentLoaded", () => {
      renderTabs();
      renderCurrentStage();
      updateTimerDisplay();
      updateLeaderModeUI();
    });

    // --- RENDER TABS ---
    function renderTabs() {
      stageTabsContainer.innerHTML = stages.map((stg, idx) => {
        const isActive = idx === currentStageIndex;
        const isBonus = stg.id === "bonus";
        return `
          <button onclick="goToStage(${idx})" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
            isActive 
              ? (isBonus ? 'bg-amber-600 text-white font-semibold shadow-sm' : 'bg-indigo-600 text-white font-semibold shadow-sm')
              : (isBonus ? 'text-amber-700 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-950/40' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800')
          }">
            <span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] ${
              isActive ? 'bg-white/20 text-white' : (isBonus ? 'bg-amber-100 dark:bg-amber-900/60 text-amber-700 dark:text-amber-300' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300')
            }">${idx + 1}</span>
            <span>${stg.title}</span>
          </button>
        `;
      }).join("");
    }

    // --- RENDER STAGE CONTENT ---
    function renderCurrentStage() {
      const stage = stages[currentStageIndex];
      renderTabs();

      stepIndicator.textContent = `階段 ${currentStageIndex + 1} / ${stages.length}`;
      prevBtn.disabled = currentStageIndex === 0;
      nextBtn.disabled = currentStageIndex === stages.length - 1;

      resetSectionTimer();

      let html = `
        <div class="space-y-6">
          <!-- Header of Section -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-700/80 gap-2">

              <div class="flex items-center gap-2">

                <span class="text-xs text-slate-400 flex items-center gap-1">
                  <i class="ph-bold ph-clock"></i> 建議時間：${stage.suggestedTime} 分鐘
                </span>
              </div>
              <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1">${stage.title}</h2>
            </div>

              <i class="ph-bold ph-copy"></i> 複製本段內容
            </button>
          </div>
      `;

      if (stage.id === "intro") {
        html += renderIntroContent(stage);
      } else if (stage.id === "roleReflection") {
        html += renderRoleReflectionContent(stage);
      } else if (stage.id === "summary") {
        html += renderSummaryContent(stage);
      } else if (stage.id === "bonus") {
        html += renderBonusContent(stage);
      } else {
        html += renderPassageContent(stage);
      }

      html += `</div>`;
      stageContainer.innerHTML = html;
    }

    // --- SUB-RENDERERS ---

            </div>
            
            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300">
              建議邀請兩位組員開聲，分別為「面對不公委屈能收刀交託」及「在職場做和平調停的使者」祈禱：
            </p>

            <ul class="space-y-2 text-xs sm:text-sm text-slate-700 dark:text-slate-200">
              ${stg.content.prayerGuide.map(pg => `
                <li class="flex items-start gap-2">
                  <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 mt-2 flex-shrink-0"></span>
                  <div>${pg}</div>
                </li>
              `).join("")}
            </ul>
          </div>
        </div>
      `;
    }

    function renderBonusContent(stg) {
      const badgeColors = {
        emerald: "bg-emerald-100 text-emerald-800 dark:bg-emerald-950/70 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800",
        amber: "bg-amber-100 text-amber-800 dark:bg-amber-950/70 dark:text-amber-300 border-amber-200 dark:border-amber-800",
        orange: "bg-orange-100 text-orange-800 dark:bg-orange-950/70 dark:text-orange-300 border-orange-200 dark:border-orange-800",
        rose: "bg-rose-100 text-rose-800 dark:bg-rose-950/70 dark:text-rose-300 border-rose-200 dark:border-rose-800"
      };

      return `
        <div class="space-y-6">
          <p class="text-sm sm:text-base text-slate-600 dark:text-slate-300 leading-relaxed">${stg.content.tagline}</p>

          <!-- Key Scripture Clues (1 Sam 17) -->
          <div class="space-y-3">
            <div class="flex items-center justify-between text-xs font-semibold text-slate-500 uppercase tracking-wider">
              <span class="flex items-center gap-1.5 text-indigo-600 dark:text-indigo-400">
                <i class="ph-bold ph-magnifying-glass"></i> 經文顯微鏡（${stg.scriptureRef}）
              </span>
              <span class="text-slate-400">少年大衛的雙重訊號</span>
            </div>
            <div class="p-4 sm:p-6 rounded-2xl scripture-card font-serif text-sm sm:text-base leading-relaxed text-slate-800 dark:text-slate-200 border border-slate-200/60 dark:border-slate-700/60 shadow-sm space-y-2.5">
              ${stg.verses.map(v => `
                <p class="leading-relaxed">
                  <sup class="verse-num text-xs font-sans font-bold text-indigo-600 dark:text-indigo-400 mr-1 select-none">${v.num}</sup>
                  <span>${v.text}</span>
                </p>
              `).join("")}
            </div>
          </div>

          <!-- Dual Engine Portrait -->
          <div class="space-y-3">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
              <i class="ph-bold ph-gear-six text-base text-indigo-600"></i> 少年大衛不是樣板人物：同時運轉的「雙引擎」
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-5 rounded-xl border border-indigo-200 dark:border-indigo-800 bg-indigo-50/40 dark:bg-indigo-950/20 space-y-3">
                <div class="flex items-center gap-2 text-indigo-700 dark:text-indigo-300 font-bold">
                  <i class="ph-bold ph-sparkle text-lg"></i>
                  <span>${stg.content.engines.a.title}</span>
                </div>
                <ul class="space-y-2 text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                  ${stg.content.engines.a.items.map(item => `
                    <li class="flex items-start gap-2">
                      <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 mt-2 flex-shrink-0"></span>
                      <span>${item}</span>
                    </li>
                  `).join("")}
                </ul>
              </div>

              <div class="p-5 rounded-xl border border-rose-200 dark:border-rose-800 bg-rose-50/40 dark:bg-rose-950/20 space-y-3">
                <div class="flex items-center gap-2 text-rose-700 dark:text-rose-300 font-bold">
                  <i class="ph-bold ph-flame text-lg"></i>
                  <span>${stg.content.engines.b.title}</span>
                </div>
                <ul class="space-y-2 text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                  ${stg.content.engines.b.items.map(item => `
                    <li class="flex items-start gap-2">
                      <span class="w-1.5 h-1.5 rounded-full bg-rose-500 mt-2 flex-shrink-0"></span>
                      <span>${item}</span>
                    </li>
                  `).join("")}
                </ul>
              </div>
            </div>
          </div>

          <!-- Timeline: When did David turn dark? -->
          <div class="space-y-3">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
              <i class="ph-bold ph-path text-base text-indigo-600"></i> 軌跡重組：大衛是「何時黑化」的？
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              ${stg.content.timeline.map((step, i) => `
                <div class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/70 dark:bg-slate-900/40 space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xs font-bold text-slate-500 dark:text-slate-400">0${i + 1} ‧ ${step.stage}</span>
                    <span class="text-[11px] font-semibold px-2 py-0.5 rounded border ${badgeColors[step.color] || badgeColors.amber}">${step.label}</span>
                  </div>
                  <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${step.desc}</p>
                </div>
              `).join("")}
            </div>

            <div class="p-4 sm:p-5 rounded-xl bg-gradient-to-r from-indigo-50 to-purple-50 dark:from-indigo-950/40 dark:to-purple-950/30 border border-indigo-200/80 dark:border-indigo-800/80 text-xs sm:text-sm text-slate-800 dark:text-slate-200 leading-relaxed">
              <div class="font-bold text-indigo-700 dark:text-indigo-300 mb-1 flex items-center gap-1.5">
                <i class="ph-bold ph-lightbulb text-base"></i> 核心洞察
              </div>
              ${stg.content.coreInsight}
            </div>
          </div>

          <!-- Workplace Takeaways -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
            ${stg.content.workplaceNotes.map(n => `
              <div class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900/60 shadow-sm space-y-1.5">
                <h4 class="font-bold text-sm text-indigo-700 dark:text-indigo-400">${n.title}</h4>
                <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${n.text}</p>
              </div>
            `).join("")}
          </div>

          <!-- Bonus Discussion Questions -->
          <div class="space-y-3 pt-1">
            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
              <i class="ph-bold ph-chats text-base text-indigo-600"></i> 彩蛋延伸討論（供有餘裕時間的小組深挖）
            </div>
            <div class="space-y-3">
              ${stg.questions.map(qObj => `
                <div class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900/60 shadow-sm space-y-2">
                  <p class="font-medium text-sm sm:text-base text-slate-900 dark:text-white font-serif leading-snug">${qObj.q}</p>
                  <div class="leader-only ${isLeaderMode ? '' : 'hidden'} text-xs text-amber-800 dark:text-amber-300/90 bg-amber-50/70 dark:bg-amber-950/30 p-2.5 rounded-lg border border-amber-200/60 dark:border-amber-900/40 flex items-start gap-1.5">
                    <i class="ph-bold ph-key text-sm mt-0.5 flex-shrink-0 text-amber-600"></i>
                    <div><strong>組長引導提示：</strong>${qObj.hint}</div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    // --- NAVIGATION LOGIC ---
    function nextStage() {
      if (currentStageIndex < stages.length - 1) {
        currentStageIndex++;
        renderCurrentStage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function prevStage() {
      if (currentStageIndex > 0) {
        currentStageIndex--;
        renderCurrentStage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function goToStage(index) {
      if (index >= 0 && index < stages.length) {
        currentStageIndex = index;
        renderCurrentStage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // --- INTERACTIVE ACTIONS ---
    function setRole(roleId) {
      selectedRole = roleId;
      renderCurrentStage();
    }

    function selectTriggerPoll(button) {
      document.querySelectorAll(".poll-btn").forEach(btn => {
        btn.classList.remove("ring-2", "ring-rose-500", "bg-rose-50", "dark:bg-rose-950/50");
      });
      button.classList.add("ring-2", "ring-rose-500", "bg-rose-50", "dark:bg-rose-950/50");
      showToast("已選擇！請同組員分享具體觸發經歷");
    }

    function saveAndCopyNotes() {
      const textarea = document.getElementById("reflectionNotes");
      if (textarea && textarea.value.trim() !== "") {
        copyTextToClipboard(textarea.value);
        showToast("筆記已複製到剪貼簿！");
      } else {
        showToast("請先輸入一些筆記內容");
      }
    }

    function copyCurrentScriptureOrQuestions() {
      const current = stages[currentStageIndex];
      let textToCopy = `【${current.title}】\n`;
      if (current.verses) {
        textToCopy += `經文 (${current.scriptureRef}):\n` + 
          current.verses.map(v => `${v.num}. ${v.text.replace(/<[^>]*>/g, '')}`).join("\n") + "\n\n";
      }
      if (current.questions) {
        textToCopy += `討論題目:\n` + current.questions.map(q => q.q).join("\n") + "\n";
      }
      if (current.id === "intro") {
        textToCopy += `破冰問題:\n${current.content.icebreakerQuestion}\n`;
      }
      copyTextToClipboard(textToCopy);
      showToast("已複製本段內容至剪貼簿！");
    }

    function copyTextToClipboard(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
      } catch (err) {
        console.error("Copy failed", err);
      }
      document.body.removeChild(textarea);
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.textContent = message;
      toast.classList.remove("opacity-0", "translate-y-20");
      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-20");
      }, 2500);
    }

    // --- HIGHLIGHT TOGGLE LOGIC ---
    function toggleHighlights() {
      isHighlightActive = !isHighlightActive;
      const body = document.body;
      if (isHighlightActive) {
        body.classList.add("hl-active");
        hlToggleBtn.className = "flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition bg-yellow-100 border-yellow-300 text-yellow-900 dark:bg-yellow-950/60 dark:border-yellow-700 dark:text-yellow-200";
        showToast("已開啟重點經文高亮");
      } else {
        body.classList.remove("hl-active");
        hlToggleBtn.className = "flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition bg-slate-100 border-slate-300 text-slate-700 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300";
        showToast("已關閉經文高亮");
      }
    }

    // --- LEADER MODE LOGIC ---
    function toggleLeaderMode() {
      isLeaderMode = !isLeaderMode;
      updateLeaderModeUI();
    }

    function updateLeaderModeUI() {
      if (isLeaderMode) {
        leaderBanner.classList.remove("hidden");
        modeToggleBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition bg-amber-50 border-amber-300 text-amber-900 dark:bg-amber-950/60 dark:border-amber-700 dark:text-amber-200";
        modeText.textContent = "組長帶領模式";
      } else {
        leaderBanner.classList.add("hidden");
        modeToggleBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition bg-slate-100 border-slate-300 text-slate-700 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300";
        modeText.textContent = "組員精簡模式";
      }

      document.querySelectorAll(".leader-only").forEach(el => {
        if (isLeaderMode) {
          el.classList.remove("hidden");
        } else {
          el.classList.add("hidden");
        }
      });
    }

    // --- SECTION TIMER LOGIC ---
    function updateTimerDisplay() {
      const mins = Math.floor(timerRemaining / 60);
      const secs = timerRemaining % 60;
      timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        timerIcon.className = "ph-fill ph-play text-slate-700 dark:text-slate-300";
      } else {
        isTimerRunning = true;
        timerIcon.className = "ph-fill ph-pause text-indigo-600 dark:text-indigo-400";
        timerInterval = setInterval(() => {
          if (timerRemaining > 0) {
            timerRemaining--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerIcon.className = "ph-fill ph-play text-slate-700 dark:text-slate-300";
            showToast("此段建議時間已到，可準備過渡到下一階段！");
          }
        }, 1000);
      }
    }

    function resetSectionTimer() {
      if (timerInterval) clearInterval(timerInterval);
      isTimerRunning = false;
      timerIcon.className = "ph-fill ph-play text-slate-700 dark:text-slate-300";
      timerDuration = stages[currentStageIndex].suggestedTime * 60;
      timerRemaining = timerDuration;
      updateTimerDisplay();
    }

    // --- DARK MODE LOGIC ---
    function toggleDarkMode() {
      const html = document.documentElement;
      const themeIcon = document.getElementById("themeIcon");
      if (html.classList.contains("dark")) {
        html.classList.remove("dark");
        themeIcon.className = "ph-bold ph-moon text-lg";
      } else {
        html.classList.add("dark");
        themeIcon.className = "ph-bold ph-sun text-lg";
      }
    }
  </script>
</body>
</html>
